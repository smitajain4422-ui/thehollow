<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hollow Quests</title>
<style>
:root { --bg: #070a1c; --card: #11142b; --line: #2a2e52; --text: #efe6d4; --dim: #9a98b0; --red: #e0281c; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif;
  display: flex; justify-content: center; align-items: flex-start; padding: 40px 16px; }
.card { width: 100%; max-width: 480px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px; }
h1 { margin: 0 0 4px; font-size: 1.5rem; }
.sub { margin: 0 0 20px; color: var(--dim); font-size: .92rem; }
.go { padding: 12px 18px; border: 0; border-radius: 10px; background: var(--red); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
.bar { height: 12px; border-radius: 99px; background: #0b0e22; border: 1px solid var(--line); overflow: hidden; margin: 6px 0 4px; }
.bar i { display: block; height: 100%; width: 0; background: var(--red); transition: width .5s; }
.count { color: var(--dim); font-size: .85rem; margin-bottom: 16px; }
.offer { display: flex; align-items: center; gap: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 12px;
  color: inherit; text-decoration: none; background: #0b0e22; }
.offer:hover { border-color: var(--red); }
.offer img { width: 40px; height: 40px; border-radius: 8px; flex: none; background: var(--line); }
.offer span { flex: 1; min-width: 0; }
.offer b { display: block; }
.offer small { color: var(--dim); }
.offer .go { padding: 8px 12px; font-size: .85rem; flex: none; }
.offer.started .go { background: #444a7a; }
.offer.done { opacity: .6; pointer-events: none; }
.offer.done .go { background: #2f8a4a; }
form { display: flex; gap: 8px; margin-top: 18px; }
input { flex: 1; min-width: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: #0b0e22; color: var(--text); font: inherit; }
button { padding: 12px 16px; border: 0; border-radius: 10px; background: var(--red); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
button:disabled { opacity: .55; cursor: progress; }
.err { min-height: 1.4em; margin: 8px 0 0; color: #ff7a6e; font-size: .9rem; }
.note { color: var(--dim); text-align: center; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card">
  <section id="stepName">
    <h1>The Hollow Quests</h1>
    <p class="sub">Enter your Roblox username to load your quests and track your reward.</p>
    <form id="nameForm">
      <input id="username" placeholder="Your Roblox username" autocomplete="username" maxlength="20" required>
      <button id="lookBtn" type="submit">Continue</button>
    </form>
    <p class="err" id="nameErr" aria-live="polite"></p>
  </section>

  <section id="stepQuest" hidden>
    <h1>The Hollow Quests</h1>
    <div id="progress" hidden>
      <p class="sub">Complete 2 quests for 1 Verity in The Hollow.</p>
      <div class="bar"><i id="fill"></i></div>
      <div class="count" id="count">0 / 2</div>
    </div>
    <div id="offers"></div>
  </section>

  <section id="stepDone" hidden>
    <h1>Done!</h1>
    <p class="sub">Your Verity is ready. Join The Hollow on Roblox and it'll be added to your inventory.</p>
  </section>
</main>

<script>
// CPA offer feed (JSONP). s1 = Roblox user id and s2 = tier, which come back in the postback (api/postback.js).
const FEED = 'https://dtvpp42hfuyb2.cloudfront.net/public/offers/feed.php?user_id=776617&api_key=39db41dd86e5e7b163a5e7fafd2958e0';
const TIER = 1; // matches TIERS[1] in lib/rewards.js: 1 Verity for 2 quests
const WAIT = 40000; // an opened quest shows "try again" if it isn't counted after this long

const $ = (s) => document.querySelector(s);
const offersEl = $('#offers');
let player = null, need = 2, completed = new Set(), started = {}, polling = 0;

const show = (id) => {
  for (const section of ['stepName', 'stepQuest', 'stepDone']) {
    $('#' + section).hidden = section !== id;
  }
};

// A supplied UID skips the username form. Otherwise, resolve the username through your backend.
const uidParam = new URLSearchParams(location.search).get('uid') || '';

async function beginQuests() {
  if (!player) return;
  show('stepQuest');
  try { started = JSON.parse(localStorage.getItem('hollow:started:' + player.id)) || {}; }
  catch { started = {}; }
  $('#progress').hidden = false;
  await fetch('/api/start?uid=' + encodeURIComponent(player.id) + '&tier=' + TIER).catch(() => {});
  loadOffers();
  clearInterval(polling);
  polling = setInterval(checkStatus, 6000);
  checkStatus();
}

$('#nameForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = $('#username').value.trim();
  const err = $('#nameErr');
  const btn = $('#lookBtn');
  err.textContent = '';
  if (!/^[A-Za-z0-9_]{3,20}$/.test(name)) {
    err.textContent = 'Roblox usernames must be 3–20 letters, numbers, or underscores.';
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Checking…';
  try {
    const r = await fetch('/api/roblox?username=' + encodeURIComponent(name));
    const data = await r.json().catch(() => ({}));
    if (r.status === 404) err.textContent = 'No Roblox player has that username.';
    else if (!r.ok || !data.id || !/^\d{1,20}$/.test(String(data.id))) {
      err.textContent = 'Could not verify that Roblox account. Please try again.';
    } else {
      player = { id: String(data.id), name: data.name || name, displayName: data.displayName || data.name || name };
      await beginQuests();
    }
  } catch {
    err.textContent = 'Could not reach Roblox. Check your connection and try again.';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Continue';
  }
});

if (/^\d{1,20}$/.test(uidParam)) {
  player = { id: uidParam };
  beginQuests();
} else {
  show('stepName');
}

function loadOffers() {
  offersEl.innerHTML = '<p class="note">loading quests…</p>';
  const cb = 'hollowOffers' + Date.now(), s = document.createElement('script');
  const fail = (text) => { window[cb] = () => {}; s.remove(); offersEl.innerHTML = ''; offersEl.append(note(text)); };
  const timer = setTimeout(() => fail('Quests took too long to load. Refresh to try again.'), 12000);
  window[cb] = (list) => { clearTimeout(timer); window[cb] = () => {}; s.remove(); render(Array.isArray(list) ? list : []); };
  s.onerror = () => { clearTimeout(timer); fail('Couldn’t load quests. Check your connection.'); };
  s.src = FEED + '&s1=' + (player ? player.id : '') + '&s2=' + TIER + '&callback=' + cb;
  document.head.appendChild(s);
}

function note(text) { const p = document.createElement('p'); p.className = 'note'; p.textContent = text; return p; }

function render(list) {
  const ok = list.filter((o) => o && /^https:\/\//.test(o.url || '')).slice(0, 5);
  if (!ok.length) { offersEl.replaceChildren(note('No quests available in your country right now.')); return; }
  offersEl.replaceChildren(...ok.map((o) => {
    const a = document.createElement('a');
    a.className = 'offer';
    a.dataset.key = String(o.id || o.url);
    a.href = o.url;
    a.target = '_blank';
    a.rel = 'noopener';
    const icon = document.createElement('img');
    icon.alt = '';
    if (/^https:\/\//.test(o.network_icon || '')) icon.src = o.network_icon;
    const text = document.createElement('span'), title = document.createElement('b'), how = document.createElement('small');
    title.textContent = o.anchor || o.name || 'Quest';
    how.textContent = o.conversion || '';
    text.append(title, how);
    const go = document.createElement('span');
    go.className = 'go';
    a.append(icon, text, go);
    a.addEventListener('click', (e) => {
      if (completed.has(a.dataset.key)) { e.preventDefault(); return; }
      started[a.dataset.key] = Date.now();
      if (player) try { localStorage.setItem('hollow:started:' + player.id, JSON.stringify(started)); } catch {}
      paint();
    });
    return a;
  }));
  paint();
}

// start -> checking… -> try again (not counted after WAIT); done ✓ once the postback counted it
function paint() {
  for (const a of offersEl.querySelectorAll('.offer')) {
    const key = a.dataset.key, t = started[key], isDone = completed.has(key), retry = !isDone && t && Date.now() - t > WAIT;
    a.classList.toggle('done', isDone);
    a.classList.toggle('started', !isDone && !!t && !retry);
    a.querySelector('.go').textContent = isDone ? 'done ✓' : retry ? 'try again' : t ? 'checking…' : 'start';
  }
}

async function checkStatus() {
  if (!player) return;
  try {
    const r = await fetch('/api/status?uid=' + player.id);
    if (!r.ok) return;
    const s = await r.json();
    need = s.need || need;
    completed = new Set((s.offers || []).map(String));
    $('#fill').style.width = Math.min(s.done, need) / need * 100 + '%';
    $('#count').textContent = Math.min(s.done, need) + ' / ' + need;
    paint();
    if (s.ready) { clearInterval(polling); show('stepDone'); }
  } catch {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && player) checkStatus(); });
</script>
</body>
</html>
