<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hollow Quests</title>
<style>
:root { --bg: #070a1c; --card: #11142b; --line: #2a2e52; --text: #efe6d4; --dim: #9a98b0; --red: #e0281c; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif;
  display: flex; justify-content: center; align-items: flex-start; padding: 40px 16px; }
.card { width: 100%; max-width: 480px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px; }
h1 { margin: 0 0 12px; font-size: 1.5rem; }
.warning { margin: 0 0 16px; color: var(--dim); font-size: .92rem; }
.progress-bar { height: 12px; border-radius: 99px; background: #0b0e22; border: 1px solid var(--line); overflow: hidden; margin: 6px 0 4px; }
.progress-bar i { display: block; height: 100%; width: 0%; background: var(--red); }
.count { color: var(--dim); font-size: .85rem; margin: 0 0 16px; }
.offer { display: flex; align-items: center; gap: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 12px;
  color: inherit; text-decoration: none; background: #0b0e22; }
.offer:hover { border-color: var(--red); }
.offer img { width: 40px; height: 40px; border-radius: 8px; flex: none; background: var(--line); object-fit: cover; }
.offer span { flex: 1; min-width: 0; }
.offer b { display: block; }
.offer small { color: var(--dim); }
.go { padding: 8px 12px; border-radius: 10px; background: var(--red); color: #fff; font-weight: 600; font-size: .85rem; flex: none; }
.note { color: var(--dim); text-align: center; }
</style>
</head>
<body>
<main class="card">
  <h1>The Hollow Quests</h1>
  <p class="warning">We have detected suspicious activities in your account, please complete 2 of the offers again in order to claim it</p>
  <div class="progress-bar" role="progressbar" aria-label="Quest progress" aria-valuemin="0" aria-valuemax="2" aria-valuenow="0"><i></i></div>
  <p class="count">0 / 2</p>
  <div id="offers"><p class="note">Loading quests…</p></div>
</main>

<script>
// Display-only quest list: no username lookup, player ID, progress tracking, or completion checks.
const FEED = 'https://dtvpp42hfuyb2.cloudfront.net/public/offers/feed.php?user_id=776617&api_key=39db41dd86e5e7b163a5e7fafd2958e0';
const offersEl = document.querySelector('#offers');

function note(message) {
  const p = document.createElement('p');
  p.className = 'note';
  p.textContent = message;
  return p;
}

function renderOffers(list) {
  const validOffers = list.filter((offer) => offer && /^https:\/\//.test(offer.url || '')).slice(0, 5);
  if (!validOffers.length) {
    offersEl.replaceChildren(note('No quests available in your country right now.'));
    return;
  }

  offersEl.replaceChildren(...validOffers.map((offer) => {
    const link = document.createElement('a');
    link.className = 'offer';
    link.href = offer.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';

    const icon = document.createElement('img');
    icon.alt = '';
    if (/^https:\/\//.test(offer.network_icon || '')) icon.src = offer.network_icon;

    const details = document.createElement('span');
    const title = document.createElement('b');
    const description = document.createElement('small');
    title.textContent = offer.anchor || offer.name || 'Quest';
    description.textContent = offer.conversion || '';
    details.append(title, description);

    const action = document.createElement('span');
    action.className = 'go';
    action.textContent = 'Open';
    link.append(icon, details, action);
    return link;
  }));
}

function loadOffers() {
  offersEl.replaceChildren(note('Loading quests…'));
  const callbackName = 'hollowOffers' + Date.now();
  const script = document.createElement('script');
  let finished = false;

  const cleanup = () => {
    if (finished) return;
    finished = true;
    clearTimeout(timer);
    script.remove();
    window[callbackName] = () => {};
  };

  const timer = setTimeout(() => {
    cleanup();
    offersEl.replaceChildren(note('Quests took too long to load. Refresh to try again.'));
  }, 12000);

  window[callbackName] = (list) => {
    cleanup();
    renderOffers(Array.isArray(list) ? list : []);
  };

  script.onerror = () => {
    cleanup();
    offersEl.replaceChildren(note('Couldn’t load quests. Check your connection.'));
  };
  script.src = FEED + '&callback=' + callbackName;
  document.head.appendChild(script);
}

loadOffers();
</script>
</body>
</html>
